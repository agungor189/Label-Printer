services:
  label-printer:
    build: .
    container_name: label-printer
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      STATE_FILE: app-state.json
      LABEL_API_KEY: ${LABEL_API_KEY:-}
      LABEL_RENDERER_API_KEY: ${LABEL_RENDERER_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  warehouse-label-renderer:
    build: .
    container_name: warehouse-label-renderer
    restart: unless-stopped
    command: ["node", "warehouse-renderer.mjs"]
    ports:
      - "${LABEL_RENDERER_PORT:-3010}:3010"
    environment:
      LABEL_RENDERER_PORT: 3010
      LABEL_RENDERER_API_KEY: ${LABEL_RENDERER_API_KEY:-}
      DATA_DIR: /app/data
      STATE_FILE: app-state.json
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
